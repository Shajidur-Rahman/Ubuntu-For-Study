<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⛔ YouTube Shorts Blocked • StudyBrowser Guardian</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0b0d13;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
    }
    .box {
      max-width: 580px;
      background: #141824;
      border: 1px solid #dc2626;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 20px 40px -10px rgba(220, 38, 38, 0.18);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 1.6rem;
      color: #f87171;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #dc2626;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #b91c1c;
    }
    .btn-secondary {
      background: #1e2436;
      border: 1px solid #333d59;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #252e45;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🚫</div>
    <h1>YouTube Shorts Permanently Blocked</h1>
    <p>
      Compulsive short-form videos and algorithmic rabbit holes are strictly prohibited in StudyBrowser.
      Your intellect is reserved for deep focus and academic lectures.
    </p>

    <div class="btn-row">
      <a href="https://www.youtube.com/" class="btn btn-primary">📺 Go to YouTube Lectures</a>
      <a href="dashboard.html" class="btn btn-secondary">← StudyBrowser Portal</a>
    </div>
  </div>
</body>
</html>
